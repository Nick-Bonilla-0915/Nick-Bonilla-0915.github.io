<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Pokemon Team Maker</title>
        <link rel="stylesheet" href="Asynch_Fetch.css">
        <script src="Asynch_Fetch.js"></script>
    </head>

    <body>
        <section>
            <h2>Name or ID</h2>
            <div class="findPoke">
                <input type="text" name="inName" id="inName">
                <button onclick="findPokemon()">Find</button>
            </div>
            <img></img>
            
            <div class="moveSet">
                <select name="move1" id="move1">
                </select>
                <select name="move2" id="move2">
                </select><br>
                <select name="move3" id="move3">
                </select>
                <select name="move4" id="move4">
                </select><br>
            </div>
            <div class="submitButton">
                <button onclick="addPokemon()">Add to Team</button>
            </div>
        </section>


    </body>



</html>
